name: Kiểm tra PoC
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ssc
          POSTGRES_PASSWORD: ssc_local
          POSTGRES_DB: ssc_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U ssc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ssc:ssc_local@127.0.0.1:55432/ssc_test?schema=public
      APP_BASE_URL: http://127.0.0.1:5173
      DEMO_MODE: "true"
      FIELD_ENCRYPTION_KEY: "1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
      PAYMENT_WEBHOOK_SECRET: ci-only-mock-secret-never-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run lint && npm run typecheck && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev > /tmp/ssc-dev.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/api/v1/ready && break || sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
